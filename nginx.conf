server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 1. Включаем сжатие Gzip (уменьшит размер передаваемого трафика в разы)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml text/javascript;

    # 2. Ассеты Astro с хэшами в имени — кэшируем на 1 год с флагом immutable
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 3. Картинки новостей, аватарки, шрифты и иконки — кэшируем на 30 дней
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|avif|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    # 4. HTML-страницы и роутинг Astro SSG
    location / {
        try_files $uri $uri/ $uri.html /404.html =404;
        # Заставляем браузер проверять обновления страниц
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}