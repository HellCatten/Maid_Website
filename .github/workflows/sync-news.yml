name: Sync Discord News (Test)

on:
  push:
    branches:
      - news-bot
    # Игнорируем пуши контента от бота, чтобы не зацикливаться:
    paths-ignore:
      - 'src/content/news/**'
      - 'public/news-images/**'
  workflow_dispatch:
    inputs:
      force_resync:
        description: 'Скачать всё заново с нуля?'
        required: false
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          ref: news-bot

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run news sync
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          FORCE_RESYNC: ${{ inputs.force_resync || false }}
        run: node scripts/sync-news.mjs

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add public/news-images/ src/content/news/
          
          if ! git diff --cached --quiet; then
            # [skip ci] гарантирует, что GitHub Actions не перезапустится
            git commit -m "chore(news): sync news from Discord [skip ci]"
            git push origin news-bot
          else
            echo "Нет изменений для коммита."
          fi