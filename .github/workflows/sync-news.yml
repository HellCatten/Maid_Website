name: Sync Discord News (Test)

on:
  push:
    branches:
      - news-bot        # Сработает сразу же при пуше в эту ветку
  workflow_dispatch:      # Оставляем на будущее

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Примечание: для тестов внутри этой же ветки можно использовать
          # стандартный secrets.GITHUB_TOKEN, если PAT еще не создан
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          ref: news-bot   # Четко указываем ветку для теста

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run news sync
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: node scripts/sync-news.mjs

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add public/news-images/ src/content/news/ scripts/sync-state.json
          
          if ! git diff --cached --quiet; then
            git commit -m "chore(news): sync news from Discord [test]"
            git push origin news-bot
          else
            echo "Нет изменений для коммита."
          fi